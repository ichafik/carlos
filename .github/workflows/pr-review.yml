name: Carlos Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]

permissions:
  contents: write        # merge
  pull-requests: write   # comments, labels
  statuses: write        # "Carlos Review Gate" commit status
  checks: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

env:
  TEST_DIR: tests   # folder containing the test scripts; every *.py in here is run

jobs:
  # ---------------------------------------------------------------------------
  # Run every Python test script found in the test folder.
  # Only runs on code-changing events (PR opened/updated); skipped for
  # review/comment events so "carlos ..." commands stay fast.
  # ---------------------------------------------------------------------------
  tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (if requirements.txt exists)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found - skipping."
          fi

      - name: List test scripts
        run: |
          echo "Test scripts discovered in ./${TEST_DIR}:"
          find "${TEST_DIR}" -maxdepth 1 -name "*.py" -type f | sort

      - name: Run all test scripts in ${{ env.TEST_DIR }}
        # -s  : start directory to search
        # -p  : pattern – "*.py" picks up ANY script in the folder, not just test_*.py
        # -v  : verbose per-test output
        # Runs from the repo root so `apps.*` imports resolve.
        run: python -m unittest discover -s "${TEST_DIR}" -p "*.py" -v

  # ---------------------------------------------------------------------------
  # AI review / gate / command handling.
  # Depends on `tests`: if tests fail, the review is skipped and auto-merge
  # cannot happen. If tests were skipped (comment/review events) we still run.
  # ---------------------------------------------------------------------------
  carlos:
    needs: tests
    # PR events: skip drafts. Comment events: only on PRs, only "carlos ..." commands.
    if: >
      !cancelled() &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
      (
        (github.event_name != 'issue_comment' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         startsWith(github.event.comment.body, 'carlos '))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r .github/scripts/requirements.txt

      - name: Run review / gate / command
        id: carlos
        env:
          # Pick ONE provider and set the matching secret below; the other two
          # keys can stay empty. See .github/scripts/llm_providers.py.
          PROVIDER: gemini   # gemini | openai | claude
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}   # empty on comment events; script fetches it
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BOT_NAME: carlos
          STATUS_CONTEXT: Carlos Review Gate   # name of the required status check in branch protection
          # MODEL: leave unset to use the PROVIDER's default (see DEFAULT_MODELS in
          # llm_providers.py); uncomment to override, e.g. gpt-4.1, claude-sonnet-4-5.
          # MODEL: ""
          TESTS_RESULT: ${{ needs.tests.result }}   # success | skipped – available to the review script
          # Paths that always require at least one human approver, even at 95%+
          PROTECTED_PATHS: "auth/,payments/,migrations/,infra/,.github/workflows/"
        run: python .github/scripts/carlos_review.py

      - name: Enable auto-merge (score >= 95, no blockers, unprotected, tests passed)
        if: >
          steps.carlos.outputs.auto_merge == 'true' &&
          github.event_name == 'pull_request' &&
          needs.tests.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}